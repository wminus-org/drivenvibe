version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      development-tooling:
        dependency-type: development
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      clerk:
        patterns:
          - "@clerk/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
