<!doctype html>
<html lang="en" data-mode="phone">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>drivenvibe live demo</title>
  <meta name="description" content="Try the drivenvibe phone app in your browser. Everything is simulated: no account, no microphone, no server." />
  <meta name="theme-color" content="#14161B" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="https://drivenvibe.com/demo/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      background-color: #14161B;
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 33px,
        rgba(233, 228, 216, 0.045) 33px, rgba(233, 228, 216, 0.045) 34px);
      color: #E9E4D8;
      font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #65E6D9; text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid #65E6D9; outline-offset: 3px; }
    code { font: 0.95em ui-monospace, SFMono-Regular, Consolas, monospace; color: #E9E4D8;
      background: #0E1014; border: 1px solid rgba(233,228,216,.12); padding: 1px 6px; border-radius: 3px; }

    .bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 10px 20px; border-bottom: 1px solid rgba(233,228,216,.1); background: rgba(20,22,27,.92); }
    .brand { color: #E9E4D8; font-weight: 700; font-size: 18px; text-decoration: none; letter-spacing: -0.2px; }
    .note { margin: 0; flex: 1; min-width: 0; color: #B9B3A6; }
    .note strong { color: #33D6C6; font-weight: 600; }
    .toggle { display: inline-flex; border: 1.5px solid #33D6C6; border-radius: 999px; overflow: hidden; }
    .toggle button { font: inherit; font-size: 13px; padding: 5px 13px; border: 0; cursor: pointer;
      background: transparent; color: #65E6D9; }
    .toggle button[aria-pressed="true"] { background: #33D6C6; color: #0c1014; font-weight: 600; }

    .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .phone { width: 390px; height: min(844px, 100%); max-width: 100%;
      padding: 12px; border-radius: 52px; background: #060708;
      border: 2px solid rgba(233,228,216,.28);
      box-shadow: 12px 15px 0 rgba(51,214,198,.12), 0 24px 60px rgba(0,0,0,.45); }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 40px; background: #000; }

    [data-mode="full"] .stage { padding: 0; }
    [data-mode="full"] .phone { width: 100%; height: 100%; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
    [data-mode="full"] iframe { border-radius: 0; }

    /* Phones get the app full screen and a one-line banner; no toggle. */
    @media (max-width: 600px), (pointer: coarse) and (max-width: 1024px) {
      .bar { padding: 6px 12px; gap: 10px; font-size: 12px; flex-wrap: nowrap; }
      .back { display: none; }
      code { white-space: nowrap; }
      .brand { font-size: 15px; }
      .toggle { display: none; }
      .stage { padding: 0; }
      .phone { width: 100%; height: 100%; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      iframe { border-radius: 0; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">drivenvibe</a>
    <p class="note"><strong>Demo</strong> — data is fake. Self-host with <code>npx drivenvibe</code><span class="back"> · <a href="/">back to drivenvibe.com</a></span></p>
    <div class="toggle" role="group" aria-label="Demo view">
      <button type="button" data-mode="phone" aria-pressed="true">Phone</button>
      <button type="button" data-mode="full" aria-pressed="false">Full screen</button>
    </div>
  </header>
  <main class="stage">
    <div class="phone">
      <iframe src="/demo/app/" title="drivenvibe app (demo)"></iframe>
    </div>
  </main>
  <script src="/demo/frame.js"></script>
</body>
</html>
